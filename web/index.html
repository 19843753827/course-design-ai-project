<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业表面缺陷智能检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px 0; }
        .card { box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { border-color: #2a5298; background-color: #f0f5ff; }
        .result-box { background-color: #f8f9fa; border-radius: 8px; padding: 20px; }
        .confidence-bar { height: 20px; background-color: #e9ecef; border-radius: 10px; overflow: hidden; }
        .confidence-fill { height: 100%; background: linear-gradient(90deg, #2a5298, #4a90d9); transition: width 0.5s; }
        .table th { background-color: #1e3c72; color: white; }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <div class="header">
        <div class="container">
            <h3>🏭 工业零部件表面缺陷智能检测系统</h3>
            <p class="mb-0">基于机器视觉与深度学习的质量控制应用 | B/S架构</p>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <!-- 左侧：上传检测区 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <strong>缺陷检测</strong>
                    </div>
                    <div class="card-body">
                        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                            <p>点击或拖拽图片到此处上传</p>
                            <p class="text-muted small">支持 JPG、PNG、BMP 格式</p>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" style="display:none">
                        <div id="previewArea" class="mt-3" style="display:none;">
                            <img id="previewImg" class="img-fluid rounded" style="max-height:250px;">
                        </div>
                        <button id="detectBtn" class="btn btn-primary w-100 mt-3" disabled onclick="doDetect()">
                            开始检测
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧：检测结果区 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <strong>检测结果</strong>
                    </div>
                    <div class="card-body">
                        <div id="resultArea" class="result-box">
                            <p class="text-muted text-center">请先上传图片并点击检测</p>
                        </div>
                    </div>
                </div>

                <!-- 统计信息 -->
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <strong>检测统计</strong>
                    </div>
                    <div class="card-body">
                        <div id="statsArea">
                            <p class="text-muted text-center">加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部：历史记录区 -->
        <div class="card">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <strong>历史检测记录</strong>
                <button class="btn btn-sm btn-outline-light" onclick="loadRecords()">刷新</button>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>图片</th>
                            <th>缺陷类型</th>
                            <th>置信度</th>
                            <th>检测时间</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTable">
                        <tr><td colspan="5" class="text-center text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        const API_BASE = 'http://127.0.0.1:5000';

        // 上传区域点击事件
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('previewArea').style.display = 'block';
                    document.getElementById('detectBtn').disabled = false;
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        // 拖拽上传
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.backgroundColor = '#e8f0fe'; });
        uploadArea.addEventListener('dragleave', e => { uploadArea.style.backgroundColor = ''; });
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.style.backgroundColor = '';
            if (e.dataTransfer.files.length > 0) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                document.getElementById('fileInput').dispatchEvent(new Event('change'));
            }
        });

        // 执行检测
        async function doDetect() {
            if (!selectedFile) return;
            const btn = document.getElementById('detectBtn');
            btn.disabled = true;
            btn.textContent = '检测中...';
            document.getElementById('resultArea').innerHTML = '<p class="text-center">正在分析图片，请稍候...</p>';

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch(`${API_BASE}/api/detect`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    const data = result.data;
                    const confidencePercent = (data.confidence * 100).toFixed(1);
                    document.getElementById('resultArea').innerHTML = `
                        <h5 class="text-center mb-3">检测完成</h5>
                        <p><strong>缺陷类型：</strong><span class="badge bg-danger">${data.defect_type}</span></p>
                        <p><strong>置信度：</strong>${confidencePercent}%</p>
                        <div class="confidence-bar mb-3">
                            <div class="confidence-fill" style="width:${confidencePercent}%"></div>
                        </div>
                        <p><strong>检测时间：</strong>${data.detection_time}</p>
                        <p><strong>记录ID：</strong>${data.record_id}</p>
                    `;
                    loadRecords();
                    loadStats();
                } else {
                    document.getElementById('resultArea').innerHTML = `<p class="text-danger">检测失败：${result.error}</p>`;
                }
            } catch (err) {
                document.getElementById('resultArea').innerHTML = `<p class="text-danger">请求失败：${err.message}</p>`;
            }
            btn.disabled = false;
            btn.textContent = '开始检测';
        }

        // 加载历史记录
        async function loadRecords() {
            try {
                const response = await fetch(`${API_BASE}/api/records?page=1&page_size=10`);
                const result = await response.json();
                const tbody = document.getElementById('recordsTable');
                
                if (result.data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无检测记录</td></tr>';
                    return;
                }
                
                tbody.innerHTML = result.data.records.map(r => `
                    <tr>
                        <td>${r.id}</td>
                        <td><img src="${API_BASE}${r.image_path}" style="width:60px;height:60px;object-fit:cover;border-radius:4px;"></td>
                        <td><span class="badge bg-warning">${r.defect_type}</span></td>
                        <td>${(r.confidence * 100).toFixed(1)}%</td>
                        <td>${r.detection_time}</td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('recordsTable').innerHTML = `<tr><td colspan="5" class="text-center text-danger">加载失败：${err.message}</td></tr>`;
            }
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const result = await response.json();
                const data = result.data;
                let html = `<p><strong>总检测次数：</strong>${data.total_detections}</p>`;
                if (data.defect_distribution.length > 0) {
                    html += '<table class="table table-sm mb-0"><thead><tr><th>缺陷类型</th><th>数量</th></tr></thead><tbody>';
                    data.defect_distribution.forEach(s => {
                        html += `<tr><td>${s.defect_type}</td><td>${s.count}</td></tr>`;
                    });
                    html += '</tbody></table>';
                } else {
                    html += '<p class="text-muted">暂无统计数据</p>';
                }
                document.getElementById('statsArea').innerHTML = html;
            } catch (err) {
                document.getElementById('statsArea').innerHTML = `<p class="text-danger">加载失败</p>`;
            }
        }

        // 页面加载时自动加载记录和统计
        window.onload = function() {
            loadRecords();
            loadStats();
        };
    </script>
</body>
</html>
